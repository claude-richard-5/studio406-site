<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio406</title>
  <meta name="description" content="Studio406 is by invitation only. Request access.">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Self-contained on purpose: this page must never depend on anything
       under /studio/, since that path sits behind Cloudflare Access and
       an unauthenticated visitor needs this page to render regardless. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: "Manrope", "Helvetica Neue", Arial, system-ui, sans-serif;
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      /* Calligraphy photo backdrop — cover, filling the whole frame (cropped
         as needed). The mobile query below just swaps in the portrait crop and
         inherits this cover sizing. */
      background: #f4f2ef url("assets/access-web.jpg") center / cover no-repeat;
    }

    /* Portrait phone: the tall crop of the right-hand page. */
    @media (max-width: 600px) {
      body { background-image: url("assets/access-mobile.jpg"); }
    }

    /* Landscape phone: a dedicated wide crop of the spread, so a rotated phone
       fills the frame instead of showing a thin slice of the portrait art.
       Declared after the portrait rule so it wins on a short viewport; the
       950px cap keeps a wide-but-short desktop window on the desktop art. */
    @media (max-height: 600px) and (max-width: 950px) {
      body { background-image: url("assets/access-landscape.jpg"); }
    }

    /* True liquid-glass pill: light glass, no color fill, sits on the tonal gradient */
    .glass-button {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.55) 0%,
        rgba(255, 255, 255, 0.2) 35%,
        rgba(255, 255, 255, 0.14) 60%,
        rgba(255, 255, 255, 0.4) 100%
      );
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.9),
        inset 0 -1px 2px rgba(0, 0, 0, 0.06),
        inset 0 0 0 1px rgba(255, 255, 255, 0.15),
        0 10px 26px rgba(0, 0, 0, 0.12),
        0 2px 6px rgba(0, 0, 0, 0.08);
      padding: 0.83rem 2.06rem;
      font-weight: 700;
      font-size: 0.86rem;
      letter-spacing: 0.01em;
      color: #14213a;
      text-decoration: none;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
      cursor: pointer;
      white-space: nowrap;
      transition: box-shadow 0.25s ease, transform 0.15s ease, background 0.25s ease;
    }

    /* Diagonal specular sheen — the thing that actually reads as "glass" */
    .glass-button::before {
      content: "";
      position: absolute;
      inset: -40% -20%;
      background: linear-gradient(
        115deg,
        rgba(255, 255, 255, 0) 30%,
        rgba(255, 255, 255, 0.55) 45%,
        rgba(255, 255, 255, 0.05) 58%,
        rgba(255, 255, 255, 0) 70%
      );
      transform: translateX(-15%) rotate(3deg);
      pointer-events: none;
      z-index: 0;
      transition: transform 0.5s ease;
    }

    .glass-button span {
      position: relative;
      z-index: 1;
    }

    .glass-button:hover {
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 1),
        inset 0 -1px 2px rgba(0, 0, 0, 0.06),
        inset 0 0 0 1px rgba(255, 255, 255, 0.2),
        0 14px 32px rgba(0, 0, 0, 0.16),
        0 3px 8px rgba(0, 0, 0, 0.1);
      transform: translateY(-1px);
    }

    .glass-button:hover::before {
      transform: translateX(15%) rotate(3deg);
    }

    .glass-button:active {
      transform: translateY(0);
    }

    .gate {
      position: absolute;
      left: 50%;
      top: 50%; /* centered; the art is cropped so this lands in the open gutter, clear of the calligraphy */
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.125rem;
      transform: translate(-50%, -50%) scale(0.75);
    }

    /* ---- Request Access modal (vanilla; Max will restyle later) ---- */
    .request-modal {
      margin: auto;                 /* centered in the viewport */
      border: none;
      border-radius: 20px;
      padding: 0;
      width: 360px;
      max-width: calc(100vw - 2rem);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.9),
        0 24px 64px rgba(0, 0, 0, 0.28);
      color: #14213a;
    }
    .request-modal::backdrop {
      background: rgba(20, 20, 20, 0.4);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    #request-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1.9rem 1.6rem;
    }
    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-align: center;
    }
    .modal-lead {
      margin-top: -0.4rem;
      font-size: 0.86rem;
      font-weight: 400;
      line-height: 1.45;
      text-align: center;
      color: #3d4557;
    }
    .modal-input {
      width: 100%;
      padding: 0.8rem 1.1rem;
      border-radius: 999px;
      border: 1px solid rgba(20, 33, 58, 0.16);
      background: rgba(255, 255, 255, 0.86);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 400;
      color: #14213a;
    }
    .modal-input::placeholder { color: #9aa0ac; }
    .modal-input:focus {
      outline: none;
      border-color: rgba(20, 33, 58, 0.5);
      box-shadow: 0 0 0 3px rgba(20, 33, 58, 0.12);
    }
    #request-form .glass-button { width: 100%; }
    .modal-status {
      min-height: 1.1em;
      margin-top: -0.25rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
      color: #a12b2b;
    }
    .modal-status a { color: inherit; }
    /* Honeypot (hidden bot trap) + screen-reader-only label */
    .hp {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px; padding: 0; border: 0;
      clip: rect(0 0 0 0); clip-path: inset(50%);
      overflow: hidden; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="gate">
    <a class="glass-button" id="request-btn" href="mailto:access@studio406.co?subject=Studio406%20access%20request">
      <span>Request Access</span>
    </a>
  </div>

  <dialog class="request-modal" id="request-modal" aria-labelledby="modal-title">
    <form id="request-form" novalidate>
      <h2 class="modal-title" id="modal-title">Request Access</h2>
      <p class="modal-lead">Leave your email and we&rsquo;ll be in touch.</p>
      <label class="sr-only" for="email">Email address</label>
      <input class="modal-input" id="email" name="email" type="email"
             placeholder="you@example.com" autocomplete="email" inputmode="email" required>
      <input class="hp" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="glass-button" type="submit"><span>Submit Request</span></button>
      <p class="modal-status" id="modal-status" role="status" aria-live="polite"></p>
    </form>
  </dialog>

  <script>
    (function () {
      var btn = document.getElementById('request-btn');
      var modal = document.getElementById('request-modal');
      var form = document.getElementById('request-form');
      var statusEl = document.getElementById('modal-status');

      // No <dialog> support (or something missing)? Leave the mailto: link working.
      if (!btn || !modal || !form || typeof modal.showModal !== 'function') return;

      btn.addEventListener('click', function (e) {
        e.preventDefault();
        statusEl.textContent = '';
        modal.showModal();
      });

      // Clicking the dimmed backdrop (outside the form) closes it.
      modal.addEventListener('click', function (e) {
        if (e.target === modal) modal.close();
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = form.email.value.trim();
        var submitBtn = form.querySelector('button[type="submit"]');
        statusEl.textContent = 'Sending…';
        submitBtn.disabled = true;

        fetch('/api/request-access', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email: email, website: form.website.value })
        })
          .then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (data) {
              return { ok: res.ok, data: data };
            });
          })
          .then(function (r) {
            if (r.ok && r.data.ok) {
              form.innerHTML =
                '<h2 class="modal-title">Request received</h2>' +
                '<p class="modal-lead">Thanks &mdash; we&rsquo;ll be in touch at ' + escapeHtml(email) + '.</p>' +
                '<button class="glass-button" type="button" id="modal-done"><span>Close</span></button>';
              document.getElementById('modal-done').addEventListener('click', function () { modal.close(); });
            } else {
              statusEl.textContent = r.data.error || 'Something went wrong. Please try again.';
              submitBtn.disabled = false;
            }
          })
          .catch(function () {
            statusEl.innerHTML = 'Couldn’t send. Please email <a href="mailto:access@studio406.co">access@studio406.co</a> directly.';
            submitBtn.disabled = false;
          });
      });

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
    })();
  </script>
</body>
</html>
