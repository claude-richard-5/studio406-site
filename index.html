<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio406</title>
  <meta name="description" content="Studio406 is by invitation only. Request access.">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&display=swap" rel="stylesheet">
  <style>
    /* Self-contained on purpose: this page must never depend on anything

    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Manrope", "Helvetica Neue", Arial, system-ui, sans-serif;
      background: #161616;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 2.5rem;
    }
    a {
      display: inline-block;
      background: #ff2222;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.01em;
      padding: 0.85rem 2rem;
      border-radius: 2px;
    }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <h1>Studio406</h1>
  <a href="mailto:access@studio406.co?subject=Studio406%20access%20request">Request access</a>
