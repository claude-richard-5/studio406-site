<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio406</title>
  <meta name="description" content="Studio406 is by invitation only. Request access.">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&display=swap" rel="stylesheet">
  <style>
    /* Self-contained on purpose: this page must never depend on anything
       under /studio/, since that path sits behind Cloudflare Access and
       an unauthenticated visitor needs this page to render regardless. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: "Manrope", "Helvetica Neue", Arial, system-ui, sans-serif;
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      /* Calligraphy photo backdrop, shown in full — contain, never cropped;
         the off-white letterbox blends with the paper. Landscape art on
         larger screens, portrait crop on phones (below). */
      background: #f4f2ef url("assets/access-web.jpg") center / contain no-repeat;
    }

    @media (max-width: 600px) {
      body { background-image: url("assets/access-mobile.jpg"); }
    }

    /* True liquid-glass pill: light glass, no color fill, sits on the tonal gradient */
    .glass-button {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.55) 0%,
        rgba(255, 255, 255, 0.2) 35%,
        rgba(255, 255, 255, 0.14) 60%,
        rgba(255, 255, 255, 0.4) 100%
      );
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.9),
        inset 0 -1px 2px rgba(0, 0, 0, 0.06),
        inset 0 0 0 1px rgba(255, 255, 255, 0.15),
        0 10px 26px rgba(0, 0, 0, 0.12),
        0 2px 6px rgba(0, 0, 0, 0.08);
      padding: 0.83rem 2.06rem;
      font-weight: 700;
      font-size: 0.86rem;
      letter-spacing: 0.01em;
      color: #14213a;
      text-decoration: none;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
      cursor: pointer;
      white-space: nowrap;
      transition: box-shadow 0.25s ease, transform 0.15s ease, background 0.25s ease;
    }

    /* Diagonal specular sheen — the thing that actually reads as "glass" */
    .glass-button::before {
      content: "";
      position: absolute;
      inset: -40% -20%;
      background: linear-gradient(
        115deg,
        rgba(255, 255, 255, 0) 30%,
        rgba(255, 255, 255, 0.55) 45%,
        rgba(255, 255, 255, 0.05) 58%,
        rgba(255, 255, 255, 0) 70%
      );
      transform: translateX(-15%) rotate(3deg);
      pointer-events: none;
      z-index: 0;
      transition: transform 0.5s ease;
    }

    .glass-button span {
      position: relative;
      z-index: 1;
    }

    .glass-button:hover {
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 1),
        inset 0 -1px 2px rgba(0, 0, 0, 0.06),
        inset 0 0 0 1px rgba(255, 255, 255, 0.2),
        0 14px 32px rgba(0, 0, 0, 0.16),
        0 3px 8px rgba(0, 0, 0, 0.1);
      transform: translateY(-1px);
    }

    .glass-button:hover::before {
      transform: translateX(15%) rotate(3deg);
    }

    .glass-button:active {
      transform: translateY(0);
    }

    .gate {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.125rem;
      transform: scale(0.75); /* all elements 25% smaller, proportions preserved */
    }
  </style>
</head>
<body>
  <div class="gate">
    <a class="glass-button" href="mailto:access@studio406.co?subject=Studio406%20access%20request">
      <span>Request Access</span>
    </a>
  </div>
</body>
</html>
